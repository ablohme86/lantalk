# Settings for lantalkd.service. Restart the service after changing them:
#   sudo systemctl restart lantalkd

# Options for lantalkd, e.g. "--port 45455 --listen 10.0.0.5". The web
# client for phones is served on --web-port (default 45456, 0 turns it off);
# add "--web-cert <file> --web-key <file>" to serve it over HTTPS.
# "--max-file-size 10" limits relayed files to 10 MB (default 50, the most
# LANTalk accepts; 0 relays no files).
# For Live Translate on the web client and in LANTalk, add e.g.
# "--ollama-url http://10.0.0.7:11434 --ollama-model translategemma"; without
# it lantalkd looks for Ollama on its network ("--no-ollama-discovery" stops
# that).
LANTALKD_OPTIONS="--port 45455 --web-port 45456"

# Password clients must enter as the Central host password. Leave empty to
# let anyone who can reach the port sign in.
LANTALK_CENTRAL_PASSWORD=
