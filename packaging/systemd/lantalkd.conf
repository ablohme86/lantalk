# Settings for lantalkd.service. Restart the service after changing them:
#   sudo systemctl restart lantalkd

# Options for lantalkd, e.g. "--port 45455 --listen 10.0.0.5".
LANTALKD_OPTIONS="--port 45455"

# Password clients must enter as the Central host password. Leave empty to
# let anyone who can reach the port sign in.
LANTALK_CENTRAL_PASSWORD=
