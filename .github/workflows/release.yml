name: Release

# Run this workflow manually to bump the version (minor by default), tag it,
# and publish a GitHub Release with a Linux tarball and Windows MSI/ZIP.
# Pushing a vX.Y.Z tag yourself publishes that version without bumping.
#
# The jobs run on the self-hosted runners registered for this repository
# (labels lantalk-linux and lantalk-windows; packaging/ci/setup-*-runner.*).
# Linux builds run in the packaging/ci container with podman. The packages go
# straight into the release, which stays a draft until all of them are in it,
# so no artifact storage is used.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"
  CI_IMAGE: lantalk-ci:qt6.8.3

jobs:
  test:
    runs-on: [self-hosted, linux, lantalk-linux]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Built once, and again only when the Containerfile changes.
      - name: Build the container image
        run: podman build -q -t "$CI_IMAGE" --build-arg "QT_VERSION=$QT_VERSION" -f packaging/ci/Containerfile packaging/ci

      - name: Build and run unit tests
        run: podman run --rm -v "$PWD:/src:Z" -w /src "$CI_IMAGE" packaging/ci/linux-build.sh test

  version:
    needs: test
    runs-on: [self-hosted, linux, lantalk-linux]
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Bump version and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Run the release from the default branch."
            exit 1
          fi
          version="$(scripts/bump-version.sh "$BUMP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git tag -a "v$version" -m "LANTalk v$version"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$version"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Read release version
        id: version
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # The draft the builds upload into; already there if the run is run
      # again.
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --title "LANTalk $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes "${prerelease[@]}"

  linux-package:
    needs: version
    runs-on: [self-hosted, linux, lantalk-linux]
    env:
      PACKAGE: LanTalk-${{ needs.version.outputs.tag }}-linux-x86_64
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Build the container image
        run: podman build -q -t "$CI_IMAGE" --build-arg "QT_VERSION=$QT_VERSION" -f packaging/ci/Containerfile packaging/ci

      - name: Build and create tarball
        run: podman run --rm -v "$PWD:/src:Z" -w /src -e PACKAGE "$CI_IMAGE" packaging/ci/linux-build.sh package

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "dist/$PACKAGE.tar.gz" --clobber

  windows-package:
    needs: version
    runs-on: [self-hosted, windows, lantalk-windows]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Windows x64 build
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DLANTALK_BUILD_TESTS=OFF

      - name: Build LANTalk
        run: cmake --build build --config Release --parallel

      - name: Stage portable Windows app
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP 'lantalk-install'
          $appDir = Join-Path $env:GITHUB_WORKSPACE 'dist\windows'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist\LanTalk-$env:RELEASE_TAG-windows-x64.zip"

          Remove-Item -Recurse -Force $stageDir, $appDir -ErrorAction SilentlyContinue
          cmake --install build --config Release --prefix $stageDir
          # Keep Qt's whole install layout: bin\qt.conf points the app at the
          # plugins\ folder next to bin\, which holds the platform plugin it
          # cannot start without.
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Copy-Item -Path (Join-Path $stageDir '*') -Destination $appDir -Recurse -Force
          Copy-Item -Path README.md, LICENSE -Destination $appDir

          foreach ($required in 'bin\lantalk.exe', 'bin\qt.conf', 'plugins\platforms\qwindows.dll') {
            if (-not (Test-Path (Join-Path $appDir $required))) {
              throw "The staged Windows app is missing $required."
            }
          }

          Compress-Archive -Path (Join-Path $appDir '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force

      # The runner keeps global .NET tools between runs: install WiX once and
      # update it only when the wanted version changes.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wanted = '7.0.0'
          $listed = dotnet tool list --global | Select-String '^\s*wix\s+(\S+)'
          if (-not $listed) {
            dotnet tool install --global wix --version $wanted
          } elseif ($listed.Matches[0].Groups[1].Value -ne $wanted) {
            dotnet tool update --global wix --version $wanted
          }
          if ($LASTEXITCODE -ne 0) { throw "WiX could not be installed (exit $LASTEXITCODE)" }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Build MSI installer
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $msiPath = "dist\LanTalk-$env:RELEASE_TAG-windows-x64.msi"
          wix build -acceptEula wix7 -arch x64 -d "ProductVersion=$env:PRODUCT_VERSION" -o $msiPath installer\LanTalk.wxs

      - name: Upload to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload $env:RELEASE_TAG "dist\LanTalk-$env:RELEASE_TAG-windows-x64.msi" "dist\LanTalk-$env:RELEASE_TAG-windows-x64.zip" --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed (exit $LASTEXITCODE)" }

  publish:
    needs: [version, linux-package, windows-package]
    runs-on: [self-hosted, linux, lantalk-linux]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      # All packages are in it: out of draft, and visible to everyone.
      - name: Publish the release
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee "$RUNNER_TEMP/assets.txt"
          for wanted in "LanTalk-$TAG-linux-x86_64.tar.gz" "LanTalk-$TAG-windows-x64.msi" "LanTalk-$TAG-windows-x64.zip"; do
            grep -qxF "$wanted" "$RUNNER_TEMP/assets.txt" || { echo "::error::the release has no $wanted"; exit 1; }
          done
          if [[ "$TAG" == *-* ]]; then latest=--latest=false; else latest=--latest; fi
          gh release edit "$TAG" --draft=false "$latest"
